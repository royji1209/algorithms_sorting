name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy margin-mailbox \
            --source ./margin-mailbox \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --quiet

      - name: Show Cloud Run Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe margin-mailbox --region us-central1 --format='value(status.url)')
          echo "================================================="
          echo "Deployed Cloud Run URL: $SERVICE_URL"
          echo "================================================="
