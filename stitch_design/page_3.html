<div class="w-12 h-[1px] bg-outline-variant/40 mt-2"></div>

하나씩 비워내고 싶다.</textarea>

<div class="flex items-center justify-between pt-6 border-t border-outline-variant/20 mt-4 text-on-surface-variant font-caption text-caption">

<span>운율 다듬기</span>
</button>
<span class="text-outline-variant/40">·</span>
<span class="tracking-wide" id="char-counter">글자 수 <strong class="font-medium text-on-surface">70</strong>자</span>
<span class="text-outline-variant/40">·</span>
<span class="flex items-center gap-1 text-on-surface-variant/80">
<span class="material-symbols-outlined text-[14px] text-tertiary">check_circle</span>
<span>자동 저장 완료 (방금)</span>
</span>
</div>
<div class="hidden sm:flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[18px]">nature</span>
<span class="text-outline-variant/80">가을의 숨결</span>
</div>
</div>
<div class="mt-10 pt-8 border-t border-outline-variant/30 flex flex-col md:flex-row md:items-center justify-between gap-6">
<div class="flex flex-col gap-3">
<div class="flex items-center gap-5">
<label class="inline-flex items-center gap-2.5 cursor-pointer group">
<input checked="" class="peer sr-only" name="visibility" type="radio" value="private">
<span class="w-4 h-4 rounded-full border border-outline flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="w-1.5 h-1.5 rounded-full bg-on-primary scale-0 peer-checked:scale-100 transition-transform"></span>
</span>
<span class="material-symbols-outlined text-[17px] text-tertiary-container group-hover:text-on-surface transition-colors">lock</span>
<span class="font-ui-label-md text-ui-label-md text-on-surface font-medium">나의 서재에만 보관 (비공개)</span>
</label>
<label class="inline-flex items-center gap-2.5 cursor-pointer group">
<input class="peer sr-only" name="visibility" type="radio" value="public">
<span class="w-4 h-4 rounded-full border border-outline flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="w-1.5 h-1.5 rounded-full bg-on-primary scale-0 peer-checked:scale-100 transition-transform"></span>
</span>

</label>

            비공개 글은 오직 당신의 서재 캘린더에서만 조용히 열람할 수 있습니다.
          </p>
</div>

            임시 보관
          </button>
<button class="px-7 py-3 rounded-lg font-ui-label-md text-ui-label-md text-on-primary bg-primary-container hover:bg-primary transition-all shadow-sm active:scale-[0.98] flex items-center gap-2" id="btn-submit" type="button">

<span>서재에 간직하기</span>
</button>
</div>
</div>

<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">edit_note</span>
<span class="font-caption text-caption">여백의 원칙: 생각을 덜어낼수록 마음은 맑아집니다.</span>
</div>
<div class="font-caption text-caption tracking-wider uppercase opacity-60">
        № 20261118-YBAK
      </div>
</div>
</div>
</div>
<script>
  (function() {
    const canvas = document.getElementById('writing-canvas');
    const counter = document.getElementById('char-counter');
    const radios = document.querySelectorAll('input[name="visibility"]');
    const desc = document.getElementById('visibility-desc');
    const submitBtn = document.getElementById('btn-submit');
    const modePills = document.querySelectorAll('.mode-pill');

    function updateCount() {
      if (canvas && counter) {
        const text = canvas.value || '';
        const len = text.replace(/[\n\r]/g, '').length;
        counter.innerHTML = `글자 수 <strong class="font-medium text-on-surface">${len}</strong>자`;
      }
    }

    if (canvas) {
      canvas.addEventListener('input', updateCount);
      updateCount();
    }

    radios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === 'public') {
          desc.textContent = '정오의 우체통을 통해 무작위의 다정한 이웃 한 명에게 편지가 전달됩니다.';
          submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">send</span><span>우편함으로 부치기</span>';
        } else {
          desc.textContent = '비공개 글은 오직 당신의 서재 캘린더에서만 조용히 열람할 수 있습니다.';
          submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">bookmark_heart</span><span>서재에 간직하기</span>';
        }
      });
    });

    modePills.forEach(pill => {
      pill.addEventListener('click', () => {
        modePills.forEach(p => {
          p.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
          p.classList.add('text-on-surface-variant');
          const dot = p.querySelector('span');
          if (dot) dot.classList.replace('bg-primary', 'bg-transparent');
        });
        pill.classList.remove('text-on-surface-variant');
        pill.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
        const activeDot = pill.querySelector('span');
        if (activeDot) activeDot.classList.replace('bg-transparent', 'bg-primary');
      });
    });
  })();
</script></div></main><footer class="w-full bg-surface-container-low/70 border-t border-outline-variant/20 py-6"><div class="max-w-[1100px] mx-auto px-6 flex items-center justify-center"><p class="font-caption text-caption text-on-surface-variant tracking-wide">조용히 머물다 떠나는 정갈한 여백의 공간 · 여백의 우체통</p></div></footer>
